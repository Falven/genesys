[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "genesys-python-probe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["temporalio==1.36.1", "nexus-rpc==1.5.0"]

[project.scripts]
genesys-python-worker = "python_probe.temporal.workers.greeting.main:main"

[tool.setuptools.packages.find]
where = ["src"]
